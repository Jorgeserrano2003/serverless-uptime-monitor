name: "CD - Deploy Infrastructure to AWS"

on:
  push:
    branches:
      - main # Se dispara automáticamente al consolidar cambios en la rama principal

permissions:
  contents: read

jobs:
  terraform:
    name: "Automated GitOps via Terraform"
    runs-on: ubuntu-latest

    # Inyección de secretos seguros del repositorio
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: "1. Clonar Código del Repositorio"
        uses: actions/checkout@v3

      - name: "2. Instalar Binario de Terraform"
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.5

      - name: "3. Inicializar Directorio de Trabajo de Terraform"
        run: terraform init
        working-directory: ./terraform

      - name: "4. Validar Sintaxis del Código"
        run: terraform validate
        working-directory: ./terraform

      - name: "5. Ejecución Automática del Plan y Despliegue Cloud"
        run: terraform apply -auto-approve
        working-directory: ./terraform
